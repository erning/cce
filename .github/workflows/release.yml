name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cce-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: cce-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: cce-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cce-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macOS: check if binary exists
            if [ -f "cce" ]; then
              strip cce || true
              chmod +x cce
            else
              echo "Warning: cce binary not found, trying alternate locations"
              ls -la || true
            fi
          else
            # Linux: check if binary exists
            if [ -f "cce" ]; then
              strip cce || true
              chmod +x cce
            else
              echo "Warning: cce binary not found"
              ls -la || true
            fi
          fi

      - name: Upload artifact (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: cce-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/cce
          if-no-files-found: error

      - name: Upload artifact (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: cce-linux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/cce
          if-no-files-found: error

      - name: Upload artifact (macOS x86_64)
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: cce-macos-x86_64
          path: target/x86_64-apple-darwin/release/cce
          if-no-files-found: error

      - name: Upload artifact (macOS ARM64)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: cce-macos-aarch64
          path: target/aarch64-apple-darwin/release/cce
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cd artifacts

          # Process Linux x86_64
          if [ -f "cce-linux-x86_64/cce" ]; then
            chmod +x cce-linux-x86_64/cce
            tar -czf ../release/cce-linux-x86_64.tar.gz -C cce-linux-x86_64 cce
          fi

          # Process Linux ARM64
          if [ -f "cce-linux-aarch64/cce" ]; then
            chmod +x cce-linux-aarch64/cce
            tar -czf ../release/cce-linux-aarch64.tar.gz -C cce-linux-aarch64 cce
          fi

          # Process macOS x86_64
          if [ -f "cce-macos-x86_64/cce" ]; then
            chmod +x cce-macos-x86_64/cce
            tar -czf ../release/cce-macos-x86_64.tar.gz -C cce-macos-x86_64 cce
          fi

          # Process macOS ARM64
          if [ -f "cce-macos-aarch64/cce" ]; then
            chmod +x cce-macos-aarch64/cce
            tar -czf ../release/cce-macos-aarch64.tar.gz -C cce-macos-aarch64 cce
          fi

          # Copy shell script
          cp ../cce ../release/cce.sh
          chmod +x ../release/cce.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/cce.sh
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
